name: device-image

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: fastboot images .tgz URL (beryl)
        required: true
        default: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.305.0.WOQCNXM/beryl_images_OS3.0.305.0.WOQCNXM_20260416.0000.00_16.0_cn_49a1fa8b77.tgz"
      mode:
        description: device kernel test
        type: choice
        options:
          - baseline
          - cgpids
        default: baseline
      module_run_id:
        description: CI run id with core-android16-6.12 artifact (cgpids mode)
        required: false
        default: ""
      device_release:
        description: override kernel release (empty = derive from Image)
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates \
            python3 python3-pip cpio lz4 zstd
          python3 -m pip install --break-system-packages vmlinux-to-elf==1.4.0
      - name: Extract boot image (streaming)
        env:
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 "$ROM_URL" | \
            tar -xz --wildcards --strip-components=2 '*/images/boot.img'
          test -s boot.img
          ls -l boot.img
      - name: Unpack boot image
        run: |
          set -euxo pipefail
          curl -fsSL -o unpack_bootimg.py \
            https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/f85a2fd5640de3688033b0c253c9f1489f223a11/unpack_bootimg.py
          python3 unpack_bootimg.py --boot_img boot.img --out boot --format=mkbootimg
          file boot/kernel
          if file boot/kernel | grep -q 'gzip compressed'; then
            gzip -dc boot/kernel > Image
          elif file boot/kernel | grep -q 'LZ4'; then
            lz4 -d boot/kernel Image
          else
            cp boot/kernel Image
          fi
          test -s Image
          strings Image | grep -m1 -E '^[0-9]+\.[0-9]+\.[0-9]+-android[0-9]+' > release.txt || true
          cat release.txt || true
      - name: Recover symbols
        run: |
          set -euxo pipefail
          if vmlinux-to-elf Image vmlinux.elf; then
            file vmlinux.elf
            readelf -h vmlinux.elf | head -20
            nm vmlinux.elf 2>/dev/null | wc -l
          else
            echo "vmlinux-to-elf failed; analysis-only artifact omitted" >&2
          fi
          strings Image | grep -m1 ttyAMA || true
      - uses: actions/upload-artifact@v4
        with:
          name: device-boot
          path: |
            Image
            release.txt
            vmlinux.elf
          if-no-files-found: warn

  boot:
    needs: extract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: device-boot
          path: device
      - uses: actions/download-artifact@v4
        if: ${{ inputs.mode == 'cgpids' && inputs.module_run_id != '' }}
        with:
          name: core-android16-6.12
          path: modules
          run-id: ${{ inputs.module_run_id }}
          github-token: ${{ github.token }}
      - name: Install QEMU and module tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-system-common qemu-system-data cpio \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu kmod python3
      - name: Patch module vermagic
        if: ${{ inputs.mode == 'cgpids' }}
        env:
          DEVICE_RELEASE: ${{ inputs.device_release }}
        run: |
          set -euxo pipefail
          RELEASE="$DEVICE_RELEASE"
          if [ -z "$RELEASE" ]; then
            RELEASE=$(awk '{print $1}' device/release.txt 2>/dev/null || true)
          fi
          test -n "$RELEASE"
          VERMAGIC="$RELEASE SMP preempt mod_unload modversions aarch64"
          echo "target vermagic: $VERMAGIC"
          for ko in modules/dnsk_*.ko; do
            aarch64-linux-gnu-objcopy --dump-section .modinfo=modinfo.bin "$ko"
            python3 - "$VERMAGIC" <<'PY'
          import sys
          magic = sys.argv[1].encode()
          data = open('modinfo.bin', 'rb').read()
          out = []
          found = False
          for entry in data.split(b'\0'):
              if entry.startswith(b'vermagic='):
                  out.append(b'vermagic=' + magic)
                  found = True
              elif entry:
                  out.append(entry)
          if not found:
              out.append(b'vermagic=' + magic)
          open('modinfo.new', 'wb').write(b'\0'.join(out) + b'\0')
          PY
            aarch64-linux-gnu-objcopy --update-section .modinfo=modinfo.new "$ko"
            modinfo -F vermagic "$ko"
          done
      - name: Build loader and initramfs
        run: |
          set -euxo pipefail
          curl -fsSL -o alpine.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz
          mkdir -p rootfs/modules
          tar -xzf alpine.tar.gz -C rootfs
          if [ "${{ inputs.mode }}" = "cgpids" ]; then
            cp modules/dnsk_core.ko modules/dnsk_cgpids.ko rootfs/modules/
            aarch64-linux-gnu-gcc -static -O2 -o insmod_force tests/qemu/insmod_force.c
            cp insmod_force rootfs/insmod_force
            cp tests/qemu/init-cgpids rootfs/init
          else
            cp tests/qemu/init-device rootfs/init
          fi
          chmod 0755 rootfs/init
          (cd rootfs && find . | cpio -o -H newc | gzip -9) > initramfs.cpio.gz
      - name: Boot and check
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set +e
          APPEND="console=ttyAMA0 earlycon=pl011,0x9000000 rdinit=/init panic=-1 nokaslr selinux=0"
          if [ "$MODE" = "cgpids" ]; then
            APPEND="$APPEND dnsk_lkm=1"
          fi
          timeout 600 qemu-system-aarch64 \
            -M virt -cpu max -m 4096 -smp 4 -nographic -no-reboot \
            -kernel device/Image -initrd initramfs.cpio.gz \
            -append "$APPEND" \
            2>&1 | tee qemu.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "qemu_rc=$rc"
          cat device/release.txt 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            echo "device kernel did not exit cleanly" >&2
            exit 1
          fi
          if [ "$MODE" = "cgpids" ]; then
            grep -q 'DNSK_CGPIDS_LKM_OK' qemu.log
            grep -q 'DNSK_CGPIDS_OK' qemu.log
          else
            grep -q 'DNSK_DEVICE_KERNEL_OK' qemu.log
          fi
          grep -q 'DNSK_QEMU_OK' qemu.log
          if grep -Eq 'Kernel panic|Oops|BUG:|CFI failure|Unknown symbol|invalid module format' qemu.log; then
            echo "kernel failure in device-image QEMU log" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: device-image-log-${{ inputs.mode }}
          path: qemu.log
          if-no-files-found: error
