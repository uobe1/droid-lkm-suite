name: device-image

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: fastboot images .tgz URL (beryl)
        required: true
        default: "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.305.0.WOQCNXM/beryl_images_OS3.0.305.0.WOQCNXM_20260416.0000.00_16.0_cn_49a1fa8b77.tgz"
      mode:
        description: device kernel test
        type: choice
        options:
          - baseline
          - cgpids
          - ksud-cgpids
          - ksud-ns
          - docker
          - ksud-docker
          - tmpfsx
          - userns
        default: baseline
      module_run_id:
        description: CI run id with core-android16-6.12 artifact (cgpids mode)
        required: false
        default: ""
      device_release:
        description: override kernel release (empty = derive from Image)
        required: false
        default: ""
      image_run_id:
        description: reuse device-boot artifact from this run id (empty = extract)
        required: false
        default: ""
      module_layout_crc:
        description: device kernel module_layout CRC (hex)
        required: false
        default: "0xe976b219"

permissions:
  contents: read
  actions: read

jobs:
  extract:
    if: ${{ inputs.image_run_id == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates \
            python3 python3-pip cpio lz4 zstd
          python3 -m pip install --break-system-packages vmlinux-to-elf==1.4.0
      - name: Extract boot image (streaming)
        env:
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 "$ROM_URL" | \
            tar -xz --wildcards --strip-components=2 '*/images/boot.img'
          test -s boot.img
          ls -l boot.img
      - name: Unpack boot image
        run: |
          set -euxo pipefail
          curl -fsSL -o unpack_bootimg.py \
            https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/f85a2fd5640de3688033b0c253c9f1489f223a11/unpack_bootimg.py
          python3 unpack_bootimg.py --boot_img boot.img --out boot --format=mkbootimg
          file boot/kernel
          if file boot/kernel | grep -q 'gzip compressed'; then
            gzip -dc boot/kernel > Image
          elif file boot/kernel | grep -q 'LZ4'; then
            lz4 -d boot/kernel Image
          else
            cp boot/kernel Image
          fi
          test -s Image
          strings Image | grep -m1 -E '^[0-9]+\.[0-9]+\.[0-9]+-android[0-9]+' > release.txt || true
          cat release.txt || true
      - name: Recover symbols
        run: |
          set -euxo pipefail
          if vmlinux-to-elf Image vmlinux.elf; then
            file vmlinux.elf
            readelf -h vmlinux.elf | head -20
            nm vmlinux.elf 2>/dev/null | wc -l
          else
            echo "vmlinux-to-elf failed; analysis-only artifact omitted" >&2
          fi
          strings Image | grep -m1 ttyAMA || true
      - uses: actions/upload-artifact@v4
        with:
          name: device-boot
          path: |
            Image
            release.txt
            vmlinux.elf
          if-no-files-found: warn

  boot:
    needs: extract
    if: ${{ always() && (needs.extract.result == 'success' || inputs.image_run_id != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ inputs.image_run_id == '' }}
        with:
          name: device-boot
          path: device
      - uses: actions/download-artifact@v4
        if: ${{ inputs.image_run_id != '' }}
        with:
          name: device-boot
          path: device
          run-id: ${{ inputs.image_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.mode != 'baseline' && inputs.module_run_id != '' }}
        with:
          name: core-android16-6.12
          path: modules
          run-id: ${{ inputs.module_run_id }}
          github-token: ${{ github.token }}
      - name: Install QEMU and module tools
        run: |
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
          sudo timeout 300 apt-get $APT_OPTS update
          sudo timeout 300 apt-get $APT_OPTS install -y --no-install-recommends \
            qemu-system-arm qemu-system-common qemu-system-data ipxe-qemu \
            ipxe-qemu-256k-compat-efi-roms qemu-efi-aarch64 cpio \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu libc6-dev-arm64-cross kmod python3
          python3 -m pip install --break-system-packages pyelftools
      - name: Patch module vermagic
        if: ${{ inputs.mode != 'baseline' }}
        env:
          DEVICE_RELEASE: ${{ inputs.device_release }}
          MODULE_LAYOUT_CRC: ${{ inputs.module_layout_crc }}
        run: |
          set -euxo pipefail
          RELEASE="$DEVICE_RELEASE"
          if [ -z "$RELEASE" ]; then
            RELEASE=$(awk '{print $1}' device/release.txt 2>/dev/null || true)
          fi
          test -n "$RELEASE"
          VERMAGIC="$RELEASE SMP preempt mod_unload modversions aarch64"
          echo "target vermagic: $VERMAGIC"
          for ko in modules/*.ko; do
            aarch64-linux-gnu-objcopy --dump-section .modinfo=modinfo.bin "$ko"
            python3 - "$VERMAGIC" <<'PY'
          import sys
          magic = sys.argv[1].encode()
          data = open('modinfo.bin', 'rb').read()
          out = []
          found = False
          for entry in data.split(b'\0'):
              if entry.startswith(b'vermagic='):
                  out.append(b'vermagic=' + magic)
                  found = True
              elif entry:
                  out.append(entry)
          if not found:
              out.append(b'vermagic=' + magic)
          open('modinfo.new', 'wb').write(b'\0'.join(out) + b'\0')
          PY
            aarch64-linux-gnu-objcopy --update-section .modinfo=modinfo.new "$ko"
            modinfo -F vermagic "$ko"
            aarch64-linux-gnu-objcopy --dump-section __versions=versions.bin "$ko"
            python3 - "$MODULE_LAYOUT_CRC" <<'PY'
          import struct, sys
          crc = int(sys.argv[1], 16)
          data = bytearray(open('versions.bin', 'rb').read())
          found = False
          for i in range(0, len(data) - 64 + 1, 64):
              if data[i + 8:i + 64].split(b'\0')[0] == b'module_layout':
                  struct.pack_into('<Q', data, i, crc)
                  found = True
                  break
          if not found:
              data += struct.pack('<Q', crc) + b'module_layout'
              data += b'\0' * (64 - 8 - len(b'module_layout'))
          print('module_layout entry', 'updated' if found else 'added', hex(crc))
          open('versions.new', 'wb').write(data)
          PY
            aarch64-linux-gnu-objcopy --update-section __versions=versions.new "$ko"
            python3 - <<'PY'
          import struct
          d = open('versions.new', 'rb').read()
          for i in range(0, len(d) - 63, 64):
              if d[i + 8:i + 64].split(b'\0')[0] == b'module_layout':
                  print('patched module_layout crc', hex(struct.unpack_from('<Q', d, i)[0]))
                  break
          PY
          done
      - name: Compute device module_layout CRC
        if: ${{ inputs.mode != 'baseline' }}
        run: |
          python3 - <<'PY'
          import struct
          from elftools.elf.elffile import ELFFile
          f = open('device/vmlinux.elf', 'rb')
          e = ELFFile(f)
          st = e.get_section_by_name('.symtab')
          def sym(name):
              s = st.get_symbol_by_name(name)
              return s[0]['st_value'] if s else None
          start = sym('__start___ksymtab')
          ksym = sym('__ksymtab_module_layout')
          crcstart = sym('__start___kcrctab')
          print('start', hex(start or 0), 'ksym', hex(ksym or 0), 'crcstart', hex(crcstart or 0))
          if start and ksym and crcstart:
              idx = (ksym - start) // 12
              print('symbol index', idx)
              for step, fmt in ((4, '<I'), (8, '<Q')):
                  addr = crcstart + idx * step
                  for sec in e.iter_sections():
                      a = sec['sh_addr']; size = sec['sh_size']
                      if a <= addr < a + size:
                          f.seek(sec['sh_offset'] + (addr - a))
                          val = struct.unpack(fmt, f.read(step))[0]
                          print('crc step', step, hex(val))
                          break
          PY
      - name: Inspect device kernel symbols
        if: ${{ inputs.mode != 'baseline' }}
        run: |
          if [ -f device/vmlinux.elf ]; then
            nm device/vmlinux.elf | grep -E 'module_layout|__crc_module_layout|kcrctab' | head -20 || true
            addr=$(nm device/vmlinux.elf | awk '/__kcrctab_module_layout/ {print $1; exit}')
            if [ -n "$addr" ]; then
              aarch64-linux-gnu-objdump -s --start-address=0x$addr                 --stop-address=$((0x$addr + 8)) device/vmlinux.elf || true
            fi
            strings device/vmlinux.elf | grep -m5 -E '6\.12\.30-android16|SMP preempt mod_unload' || true
          else
            echo "vmlinux.elf not present" >&2
          fi
      - name: Build loader and initramfs
        run: |
          set -euxo pipefail
          curl -fsSL -o alpine.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz
          mkdir -p rootfs/modules
          tar -xzf alpine.tar.gz -C rootfs
          if [ "${{ inputs.mode }}" = "cgpids" ]; then
            cp modules/dnsk_core.ko modules/dnsk_cgpids.ko rootfs/modules/
            aarch64-linux-gnu-gcc -static -O2 -o insmod_force tests/qemu/insmod_force.c
            cp insmod_force rootfs/insmod_force
            cp tests/qemu/init-cgpids rootfs/init
          elif [ "${{ inputs.mode }}" = "ksud-cgpids" ]; then
            cp modules/dnsk_core.ko modules/dnsk_cgpids.ko rootfs/modules/
            cp tests/qemu/assets/ksud rootfs/ksud
            chmod 0755 rootfs/ksud
            cp -a tests/qemu/assets/android/. rootfs/
            chmod 0755 rootfs/system/bin/linker64
            rm -f rootfs/system/etc/ld.config.txt
            aarch64-linux-gnu-gcc -static -O2 -o insmod_force tests/qemu/insmod_force.c
            cp insmod_force rootfs/insmod_force
            cp modules/selpermissive.ko rootfs/modules/
            aarch64-linux-gnu-gcc -static -O2 -o selinux_load tests/qemu/selinux_load.c
            cp selinux_load rootfs/selinux_load
            cp tests/qemu/assets/selinux-precompiled-sepolicy.gz rootfs/policy.gz
            cp tests/qemu/init-cgpids rootfs/init
          elif [ "${{ inputs.mode }}" = "ksud-ns" ]; then
            cp modules/dnsk_core.ko modules/dnsk_ns.ko rootfs/modules/
            cp tests/qemu/assets/ksud rootfs/ksud
            chmod 0755 rootfs/ksud
            cp -a tests/qemu/assets/android/. rootfs/
            chmod 0755 rootfs/system/bin/linker64
            aarch64-linux-gnu-gcc -static -O2 -o insmod_force tests/qemu/insmod_force.c
            cp insmod_force rootfs/insmod_force
            cp modules/selpermissive.ko rootfs/modules/
            aarch64-linux-gnu-gcc -static -O2 -o selinux_load tests/qemu/selinux_load.c
            cp selinux_load rootfs/selinux_load
            cp tests/qemu/assets/selinux-precompiled-sepolicy.gz rootfs/policy.gz
            cp tests/qemu/init-ns-device rootfs/init
          elif [ "${{ inputs.mode }}" = "tmpfsx" ]; then
            cp modules/dnsk_core.ko modules/dnsk_tmpfsx.ko rootfs/modules/
            cp tests/qemu/assets/ksud rootfs/ksud
            chmod 0755 rootfs/ksud
            cp -a tests/qemu/assets/android/. rootfs/
            chmod 0755 rootfs/system/bin/linker64
            aarch64-linux-gnu-gcc -static -O2 -o insmod_force tests/qemu/insmod_force.c
            cp insmod_force rootfs/insmod_force
            cp modules/selpermissive.ko rootfs/modules/
            aarch64-linux-gnu-gcc -static -O2 -o selinux_load tests/qemu/selinux_load.c
            cp selinux_load rootfs/selinux_load
            cp tests/qemu/assets/selinux-precompiled-sepolicy.gz rootfs/policy.gz
            aarch64-linux-gnu-gcc -static -O2 -o xattr_test tests/qemu/xattr_test.c
            cp xattr_test rootfs/xattr_test
            cp tests/qemu/init-tmpfsx-device rootfs/init
          elif [ "${{ inputs.mode }}" = "userns" ]; then
            cp modules/dnsk_core.ko modules/dnsk_ns.ko rootfs/modules/
            cp tests/qemu/assets/ksud rootfs/ksud
            chmod 0755 rootfs/ksud
            cp -a tests/qemu/assets/android/. rootfs/
            chmod 0755 rootfs/system/bin/linker64
            aarch64-linux-gnu-gcc -static -O2 -o insmod_force tests/qemu/insmod_force.c
            cp insmod_force rootfs/insmod_force
            cp modules/selpermissive.ko rootfs/modules/
            aarch64-linux-gnu-gcc -static -O2 -o selinux_load tests/qemu/selinux_load.c
            cp selinux_load rootfs/selinux_load
            cp tests/qemu/assets/selinux-precompiled-sepolicy.gz rootfs/policy.gz
            aarch64-linux-gnu-gcc -static -O2 -o userns_test tests/qemu/userns_test.c
            cp userns_test rootfs/userns_test
            cp tests/qemu/init-userns-device rootfs/init
          elif [ "${{ inputs.mode }}" = "docker" ] || [ "${{ inputs.mode }}" = "ksud-docker" ]; then
            cp modules/dnsk_core.ko modules/dnsk_cgpids.ko rootfs/modules/
            [ -e modules/dnsk_ns.ko ] && cp modules/dnsk_ns.ko rootfs/modules/
            if [ "${{ inputs.mode }}" = "ksud-docker" ]; then
              cp tests/qemu/assets/ksud rootfs/ksud
              chmod 0755 rootfs/ksud
              cp -a tests/qemu/assets/android/. rootfs/
              chmod 0755 rootfs/system/bin/linker64
              aarch64-linux-gnu-gcc -static -O2 -o insmod_force tests/qemu/insmod_force.c
              cp insmod_force rootfs/insmod_force
              cp modules/selpermissive.ko rootfs/modules/
              aarch64-linux-gnu-gcc -static -O2 -o selinux_load tests/qemu/selinux_load.c
              cp selinux_load rootfs/selinux_load
              cp tests/qemu/assets/selinux-precompiled-sepolicy.gz rootfs/policy.gz
            else
              aarch64-linux-gnu-gcc -static -O2 -o insmod_force tests/qemu/insmod_force.c
              cp insmod_force rootfs/insmod_force
            fi
            cp tests/qemu/init-docker-device rootfs/init
            curl -fsSL -o docker.tgz \
              https://download.docker.com/linux/static/stable/aarch64/docker-29.7.2.tgz
            mkdir -p rootfs/opt
            tar -xzf docker.tgz -C rootfs/opt
            cp rootfs/opt/docker/* rootfs/usr/bin/
            cp alpine.tar.gz rootfs/alpine.tar.gz
          else
            cp tests/qemu/init-device rootfs/init
          fi
          chmod 0755 rootfs/init
          (cd rootfs && find . | cpio -o -H newc | gzip -9) > initramfs.cpio.gz
      - name: Boot and check
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set +e
          MEM=4096
          TIMEOUT=600
          if [ "$MODE" = "docker" ] || [ "$MODE" = "ksud-docker" ]; then
            TIMEOUT=1200
          fi
          APPEND="console=ttyAMA0 earlycon=pl011,0x9000000 rdinit=/init panic=-1 nokaslr module.sig_enforce=0"
          case "$MODE" in
            ksud-cgpids|ksud-ns|ksud-docker|tmpfsx|userns) APPEND="$APPEND enforcing=0" ;;
            *) APPEND="$APPEND selinux=0" ;;
          esac
          if [ "$MODE" = "cgpids" ] || [ "$MODE" = "ksud-cgpids" ] || [ "$MODE" = "ksud-ns" ] || [ "$MODE" = "docker" ] || [ "$MODE" = "ksud-docker" ]; then
            APPEND="$APPEND dnsk_lkm=1"
          fi
          timeout "$TIMEOUT" qemu-system-aarch64 \
            -M virt -cpu max -m "$MEM" -smp 4 -nographic -no-reboot \
            -kernel device/Image -initrd initramfs.cpio.gz \
            -append "$APPEND" \
            2>&1 | tee qemu.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "qemu_rc=$rc"
          cat device/release.txt 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            echo "device kernel did not exit cleanly" >&2
            exit 1
          fi
          if [ "$MODE" = "cgpids" ] || [ "$MODE" = "ksud-cgpids" ]; then
            grep -q 'DNSK_CGPIDS_LKM_OK' qemu.log
            grep -q 'DNSK_CGPIDS_OK' qemu.log
          elif [ "$MODE" = "ksud-ns" ]; then
            grep -q 'DNSK_KSUD_LATE_LOAD_OK' qemu.log
            grep -q 'DNSK_NS_DEVICE_OK' qemu.log
          elif [ "$MODE" = "docker" ] || [ "$MODE" = "ksud-docker" ]; then
            grep -q 'DNSK_CGPIDS_LKM_OK' qemu.log
            grep -q 'DNSK_DOCKER_DEVICE_OK' qemu.log
          elif [ "$MODE" = "tmpfsx" ]; then
            grep -q 'DNSK_TMPFSX_LKM_OK' qemu.log
            grep -q 'DNSK_TMPFSX_OK' qemu.log
          elif [ "$MODE" = "userns" ]; then
            grep -q 'DNSK_USERNS_LKM_OK' qemu.log
            grep -q 'DNSK_USERNS_OK' qemu.log
          else
            grep -q 'DNSK_DEVICE_KERNEL_OK' qemu.log
          fi
          grep -q 'DNSK_QEMU_OK' qemu.log
          if grep -Eq 'Kernel panic|Oops|BUG:|CFI failure|Unknown symbol|invalid module format' qemu.log; then
            echo "kernel failure in device-image QEMU log" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: device-image-log-${{ inputs.mode }}
          path: qemu.log
          if-no-files-found: error
