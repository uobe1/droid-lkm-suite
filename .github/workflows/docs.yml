name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs tools
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mike
          sudo apt-get update
          sudo apt-get install -y doxygen
      - name: Build kernel API (verify committed page is current)
        run: |
          # kernel-doc is a self-contained perl script; fetch the same Linux
          # release this project builds against instead of a whole source tree.
          curl -fsSL -o /tmp/kernel-doc \
            https://raw.githubusercontent.com/torvalds/linux/v6.12/scripts/kernel-doc
          chmod +x /tmp/kernel-doc
          perl /tmp/kernel-doc -v >/dev/null
          make docs-kernel KERNEL_DOC=/tmp/kernel-doc
          # A committed page that no longer matches the headers is a defect, not
          # a formatting nit: it tells readers something the code no longer says.
          git diff --exit-code docs/api/kernel/index.html
      - name: Build userspace API
        run: |
          mkdir -p build/docs/doxygen-userspace
          doxygen Doxyfile
      - name: Build site
        run: |
          mkdir -p site/api/userspace
          cp -r build/docs/doxygen-userspace/html/. site/api/userspace/
          mkdocs build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
