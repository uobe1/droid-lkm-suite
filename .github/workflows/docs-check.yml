name: docs-check

# Cheap, deterministic gate that runs before any kernel build.  It needs only
# Python3, never pulls the DDK, and never touches the device.  Its job is to
# prove the committed API pages still match the documentation comments and the
# tracked Markdown still obeys docs/STYLE.md.

# Dispatch-only, like the other workflows in this repo: a push must not
# silently consume a run, and the same gate must not execute twice (once on
# push and once as ci-fast's `needs`).  It is invoked either manually or as a
# reusable workflow from ci-fast.yml's build job.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: API pages match their comment sources
        run: python3 scripts/gen-api-docs.py --check
      - name: Tracked Markdown style
        run: python3 scripts/check-docs-style.py
