name: ddk-inspect
on:
  workflow_dispatch:
  push:
    branches: [feat/device-ns-ksud]
    paths: ['.github/workflows/ddk-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Inspect modpost and symvers
        shell: bash
        run: |
          set -uxo pipefail
          KDIR=/opt/ddk/kdir/android16-6.12
          SRC=/opt/ddk/src/android16-6.12
          ls -l "$KDIR/Module.symvers" "$KDIR/vmlinux.symvers"
          echo '=== Module.symvers format ==='
          head -2 "$KDIR/Module.symvers" | cat -A
          echo '=== vmlinux.symvers format ==='
          head -2 "$KDIR/vmlinux.symvers" | cat -A
          echo '=== module_layout entries ==='
          grep -m2 'module_layout' "$KDIR/Module.symvers" || true
          grep -m2 'module_layout' "$KDIR/vmlinux.symvers" || true
          echo '=== modpost writer loops ==='
          sed -n "1860,1935p" "$SRC/scripts/mod/modpost.c"
          mkdir -p /tmp/modtest
          printf 'obj-m := modtest.o\n' >/tmp/modtest/Makefile
          cat >/tmp/modtest/modtest.c <<'EOF'
          #include <linux/module.h>
          #include <linux/kernel.h>
          static int __init tmod_init(void) { pr_info("modtest\n"); return 0; }
          static void __exit tmod_exit(void) {}
          module_init(tmod_init); module_exit(tmod_exit);
          MODULE_LICENSE("GPL");
          EOF
          make -C "$KDIR" M=/tmp/modtest modules
          echo '=== shipped-symvers mod.c ==='
          sed -n '20,45p' /tmp/modtest/modtest.mod.c
          cp "$KDIR/Module.symvers" /tmp/Module.symvers.orig
          cat "$KDIR/vmlinux.symvers" "$KDIR/Module.symvers" | \
            awk '!seen[$2]++' > "$KDIR/Module.symvers"
          wc -l "$KDIR/Module.symvers"
          rm -f /tmp/modtest/modtest.mod.c /tmp/modtest/modtest.mod.o /tmp/modtest/modtest.ko
          make -C "$KDIR" M=/tmp/modtest modules
          echo '=== merged-symvers mod.c ==='
          sed -n '20,45p' /tmp/modtest/modtest.mod.c
          cp /tmp/Module.symvers.orig "$KDIR/Module.symvers"
          : > "$KDIR/Module.symvers"
          rm -f /tmp/modtest/modtest.mod.c /tmp/modtest/modtest.mod.o /tmp/modtest/modtest.ko
          make -C "$KDIR" M=/tmp/modtest modules || true
          echo '=== empty-symvers result ==='
          ls -l /tmp/modtest/modtest.mod.c 2>&1 || true
          sed -n '20,45p' /tmp/modtest/modtest.mod.c 2>/dev/null || true
