name: ddk-inspect
on:
  workflow_dispatch:
  push:
    branches: [feat/device-ns-ksud]
    paths: ['.github/workflows/ddk-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Validate the modpost empty-version fix
        shell: bash
        run: |
          set -euxo pipefail
          KDIR=/opt/ddk/kdir/android16-6.12
          SRC=/opt/ddk/src/android16-6.12
          python3 - <<'PY'
          p = "/opt/ddk/src/android16-6.12/scripts/mod/modpost.c"
          s = open(p).read()
          old = ('\tbuf_printf(b, "__used __section(\\"__version_ext_names\\") =\\n");\n'
                 '\tlist_for_each_entry(s, &mod->unresolved_symbols, list) {')
          new = ('\tbuf_printf(b, "__used __section(\\"__version_ext_names\\") =");\n'
                 '\t{\n'
                 '\t\tstruct symbol *t;\n'
                 '\t\tbool any = false;\n'
                 '\n'
                 '\t\tlist_for_each_entry(t, &mod->unresolved_symbols, list)\n'
                 '\t\t\tif (t->module && t->crc_valid) { any = true; break; }\n'
                 '\t\tbuf_printf(b, any ? "\\n" : " \\"\\"\\n");\n'
                 '\t}\n'
                 '\tlist_for_each_entry(s, &mod->unresolved_symbols, list) {')
          assert old in s, "add_extended_versions pattern not found"
          open(p, "w").write(s.replace(old, new, 1))
          PY
          grep -n -A12 'version_ext_names\[\]' "$SRC/scripts/mod/modpost.c" | head -16
          make -C "$SRC" O="$KDIR" ARCH=arm64 LLVM=1 scripts/mod/modpost
          mkdir -p /tmp/modtest
          printf 'obj-m := modtest.o\n' >/tmp/modtest/Makefile
          cat >/tmp/modtest/modtest.c <<'EOF'
          #include <linux/module.h>
          #include <linux/kernel.h>
          static int __init tmod_init(void) { pr_info("modtest\n"); return 0; }
          static void __exit tmod_exit(void) {}
          module_init(tmod_init); module_exit(tmod_exit);
          MODULE_LICENSE("GPL");
          EOF
          make -C "$KDIR" M=/tmp/modtest modules
          sed -n '20,40p' /tmp/modtest/modtest.mod.c
          ls -l /tmp/modtest/modtest.ko
