name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_profile:
        description: ABI build profile id
        type: choice
        options:
          - android16-6.12-xt104
          - android16-6.12-xt128
        default: android16-6.12-xt104

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          sudo apt-get update
          sudo apt-get install -y shellcheck
          npm install -g markdownlint-cli
      - name: Python checks
        run: |
          python tools/kmi_matrix.py --check
          python -m py_compile tools/*.py
          ruff check tools
      - name: Shell checks
        run: |
          find tools ksu tests ci scripts -name '*.sh' -type f -print0 2>/dev/null | xargs -0 -r shellcheck
          shellcheck tools/dnskctl
      - name: Markdown checks
        run: markdownlint 'README.md' 'CONTRIBUTING.md' 'docs/**/*.md' 'profiles/**/*.md'

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run host tests
        run: python -m unittest discover -s tests/host -v

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kmi: android12-5.10
            profile: ""
          - kmi: android13-5.10
            profile: ""
          - kmi: android13-5.15
            profile: ""
          - kmi: android14-5.15
            profile: ""
          - kmi: android14-6.1
            profile: ""
          - kmi: android15-6.6
            profile: ""
          - kmi: android16-6.12
            profile: ${{ inputs.build_profile || 'android16-6.12-xt104' }}
          - kmi: android17-6.18
            profile: ""
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Build dnsk_core.ko
        shell: bash
        env:
          MATRIX_PROFILE: ${{ matrix.profile }}
        run: |
          set -euxo pipefail
          KDIR="/opt/ddk/kdir/${{ matrix.kmi }}"
          test -d "$KDIR"
          PROFILE="$MATRIX_PROFILE"
          if [ -n "$PROFILE" ]; then
            eval "$(python3 "$GITHUB_WORKSPACE/tools/build_flags.py" \
              --profile "$GITHUB_WORKSPACE/profiles/abi/${PROFILE}.json" \
              --kmi "${{ matrix.kmi }}")"
            test "$DNSK_ABI_PROFILE" = "$PROFILE"
          fi
          make -C "$KDIR" M="$GITHUB_WORKSPACE" modules
          mkdir -p "$GITHUB_WORKSPACE/build/kmi/${{ matrix.kmi }}"
          cp "$GITHUB_WORKSPACE/dnsk_core.ko" "$GITHUB_WORKSPACE/build/kmi/${{ matrix.kmi }}/"
          if [ "${{ matrix.kmi }}" = "android16-6.12" ]; then
            make -C "$GITHUB_WORKSPACE/features/ns" KDIR="$KDIR" modules
            cp "$GITHUB_WORKSPACE/features/ns/dnsk_ns.ko" "$GITHUB_WORKSPACE/build/kmi/${{ matrix.kmi }}/"
            make -C "$GITHUB_WORKSPACE/features/diag" KDIR="$KDIR" modules
            cp "$GITHUB_WORKSPACE/features/diag/dnsk_diag.ko" "$GITHUB_WORKSPACE/build/kmi/${{ matrix.kmi }}/"
            make -C "$GITHUB_WORKSPACE/features/devtmpfs" KDIR="$KDIR" \
              DNSK_ABI_PROFILE="${DNSK_ABI_PROFILE:-}" DNSK_PAGE_SIZE="${DNSK_PAGE_SIZE:-}" \
              DNSK_MAX_SKB_FRAGS="${DNSK_MAX_SKB_FRAGS:-}" \
              DNSK_CGROUP_SUBSYS_COUNT="${DNSK_CGROUP_SUBSYS_COUNT:-}" modules
            cp "$GITHUB_WORKSPACE/features/devtmpfs/dnsk_devtmpfs.ko" "$GITHUB_WORKSPACE/build/kmi/${{ matrix.kmi }}/"
            make -C "$GITHUB_WORKSPACE/features/netfilter" KDIR="$KDIR" \
              DNSK_XT_NOCOMPAT="${DNSK_XT_NOCOMPAT:-}" DNSK_XT_LAYOUT="${DNSK_XT_LAYOUT:-}" \
              DNSK_ABI_PROFILE="${DNSK_ABI_PROFILE:-}" DNSK_PAGE_SIZE="${DNSK_PAGE_SIZE:-}" \
              DNSK_MAX_SKB_FRAGS="${DNSK_MAX_SKB_FRAGS:-}" \
              DNSK_CGROUP_SUBSYS_COUNT="${DNSK_CGROUP_SUBSYS_COUNT:-}" modules
            cp "$GITHUB_WORKSPACE/features/netfilter/dnsk_netfilter.ko" "$GITHUB_WORKSPACE/build/kmi/${{ matrix.kmi }}/"
            # The android16-6.12 device has 104-byte xt_match/xt_target while
            # the DDK headers carry the 128-byte CONFIG_COMPAT layout.  Build the
            # device artifact without the compat members; QEMU builds its own
            # separate compat module.
            make -C "$GITHUB_WORKSPACE/features/ipset" KDIR="$KDIR" \
              DNSK_XT_NOCOMPAT="${DNSK_XT_NOCOMPAT:-}" DNSK_XT_LAYOUT="${DNSK_XT_LAYOUT:-}" \
              DNSK_ABI_PROFILE="${DNSK_ABI_PROFILE:-}" DNSK_PAGE_SIZE="${DNSK_PAGE_SIZE:-}" \
              DNSK_MAX_SKB_FRAGS="${DNSK_MAX_SKB_FRAGS:-}" \
              DNSK_CGROUP_SUBSYS_COUNT="${DNSK_CGROUP_SUBSYS_COUNT:-}" modules
            cp "$GITHUB_WORKSPACE/features/ipset/dnsk_ipset.ko" "$GITHUB_WORKSPACE/build/kmi/${{ matrix.kmi }}/"
            # dnskctl compares these stamps with policy.conf before insmod.
            for ko in "$GITHUB_WORKSPACE/features/netfilter/dnsk_netfilter.ko" \
                      "$GITHUB_WORKSPACE/features/ipset/dnsk_ipset.ko" \
                      "$GITHUB_WORKSPACE/features/devtmpfs/dnsk_devtmpfs.ko"; do
              for stamp in "dnsk_abi_profile=${PROFILE}" \
                           "dnsk_page_size=${DNSK_PAGE_SIZE}" \
                           "dnsk_max_skb_frags=${DNSK_MAX_SKB_FRAGS}" \
                           "dnsk_cgroup_subsys_count=${DNSK_CGROUP_SUBSYS_COUNT}"; do
                grep -aq "$stamp" "$ko" || {
                  echo "missing $stamp stamp: $ko" >&2
                  exit 1
                }
              done
            done
            for ko in "$GITHUB_WORKSPACE/features/netfilter/dnsk_netfilter.ko" \
                      "$GITHUB_WORKSPACE/features/ipset/dnsk_ipset.ko"; do
              grep -aq "dnsk_xt_layout=${DNSK_XT_LAYOUT}" "$ko" || {
                echo "missing dnsk_xt_layout=${DNSK_XT_LAYOUT} stamp: $ko" >&2
                exit 1
              }
            done
          fi
          file "$GITHUB_WORKSPACE/build/kmi/${{ matrix.kmi }}/"*.ko
          SYMVERS="$KDIR/Module.symvers"
          [ -f "$SYMVERS" ] || SYMVERS="$KDIR/vmlinux.symvers"
          cp "$SYMVERS" "$GITHUB_WORKSPACE/build/kmi/${{ matrix.kmi }}/symvers.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.kmi }}
          path: build/kmi/${{ matrix.kmi }}/
          if-no-files-found: error

  guards:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-${{ matrix.kmi }}
          path: art
      - name: Core exports must match kernel exports
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/exports_guard.py --symvers art/symvers.txt art/dnsk_core.ko
          python3 tools/imports_guard.py art/dnsk_core.ko
      - name: ipset exports must match kernel exports
        if: matrix.kmi == 'android16-6.12'
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/exports_guard.py --symvers art/symvers.txt art/dnsk_ipset.ko
          python3 tools/imports_guard.py art/dnsk_ipset.ko
      - name: Feature imports (advisory)
        shell: bash
        continue-on-error: true
        run: |
          set -uxo pipefail
          for ko in art/dnsk_*.ko; do
            [ "$ko" = "art/dnsk_core.ko" ] && continue
            python3 tools/imports_guard.py "$ko" || true
            python3 tools/exports_guard.py --symvers art/symvers.txt "$ko" || true
          done

  package-dev-612:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-android16-6.12
          path: build/kmi/android16-6.12
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true
      - name: Build static arm64 preflight
        run: |
          make -C tools CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" TARGET=aarch64-linux-android24
          file tools/bin/dnsk-preflight
      - name: Package dev artifact
        env:
          ABI_PROFILE: ${{ inputs.build_profile || 'android16-6.12-xt104' }}
        run: |
          PROFILE="$ABI_PROFILE"
          eval "$(python3 tools/build_flags.py \
            --profile "profiles/abi/${PROFILE}.json" --kmi android16-6.12)"
          sed -i "s/^xt_layout=.*/xt_layout=${DNSK_XT_LAYOUT}/" ksu/policy.conf
          sed -i "s/^abi_profile=.*/abi_profile=${DNSK_ABI_PROFILE}/" ksu/policy.conf
          sed -i "s/^page_size=.*/page_size=${DNSK_PAGE_SIZE}/" ksu/policy.conf
          sed -i "s/^max_skb_frags=.*/max_skb_frags=${DNSK_MAX_SKB_FRAGS}/" ksu/policy.conf
          sed -i "s/^cgroup_subsys_count=.*/cgroup_subsys_count=${DNSK_CGROUP_SUBSYS_COUNT}/" ksu/policy.conf
          python tools/package.py --dev \
            --kmi android16-6.12 \
            --bin-root tools/bin \
            --out out/droid_lkm_suite-v1.0.0dev0-android16-6.12.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ksu-dev-android16-6.12
          path: out/*.zip
          if-no-files-found: error
