name: probe-ddk

on:
  push:
    paths:
      - .github/workflows/probe-ddk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --user root
    steps:
      - name: Inspect DDK tree and config
        shell: bash
        run: |
          set -x
          uname -m
          nproc
          free -h
          ls -la /opt/ddk/kdir/android16-6.12 | head -40
          ls -la /opt/ddk/src/android16-6.12/arch/arm64/boot 2>&1 | head -20
          for f in /opt/ddk/kdir/android16-6.12/arch/arm64/boot/Image \
                   /opt/ddk/kdir/android16-6.12/vmlinux \
                   /opt/ddk/kdir/android16-6.12/System.map; do
            test -f "$f" && echo "PRESENT $f" || echo "MISSING $f"
          done
          grep -E '^CONFIG_(MODULES|MODULE_UNLOAD|MODULE_SIG|KALLSYMS|KALLSYMS_ALL|CFI_CLANG|DEBUG_INFO_BTF|MODVERSIONS|VMLINUX_MAP)=' \
            /opt/ddk/kdir/android16-6.12/.config || true
