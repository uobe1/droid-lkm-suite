name: qemu-core

on:
  workflow_dispatch:
    inputs:
      mode:
        description: initramfs test to run
        type: choice
        options:
          - baseline
          - active-ns
          - active-netfilter
          - active-devtmpfs
          - active-ipset
          - cgpids
          - docker
        default: baseline
      kernel:
        description: stock DDK kernel or Native oracle with container configs
        type: choice
        options:
          - stock
          - oracle
          - oracle-nopids
        default: stock
      image_run_id:
        description: reuse qemu-6.12 artifact from this run id (empty = build)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  image:
    if: ${{ inputs.image_run_id == '' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Build modules and boot Image
        if: ${{ inputs.kernel == 'stock' }}
        shell: bash
        run: |
          set -euxo pipefail
          KDIR="/opt/ddk/kdir/android16-6.12"
          make -C "$KDIR" M="$GITHUB_WORKSPACE" modules
          make -C "$GITHUB_WORKSPACE/features/ns" KDIR="$KDIR" \
            DNSK_ABI_PROFILE=android16-6.12-xt128 DNSK_PAGE_SIZE=4096 \
            DNSK_MAX_SKB_FRAGS=17 DNSK_CGROUP_SUBSYS_COUNT=8 modules
          make -C "$GITHUB_WORKSPACE/features/diag" KDIR="$KDIR" modules
          make -C "$GITHUB_WORKSPACE/features/devtmpfs" KDIR="$KDIR" \
            DNSK_ABI_PROFILE=android16-6.12-xt128 DNSK_PAGE_SIZE=4096 \
            DNSK_MAX_SKB_FRAGS=17 DNSK_CGROUP_SUBSYS_COUNT=8 modules
          make -C "$GITHUB_WORKSPACE/features/netfilter" KDIR="$KDIR" \
            DNSK_ABI_PROFILE=android16-6.12-xt128 DNSK_PAGE_SIZE=4096 \
            DNSK_MAX_SKB_FRAGS=17 DNSK_CGROUP_SUBSYS_COUNT=8 modules
          make -C "$GITHUB_WORKSPACE/features/ipset" KDIR="$KDIR" \
            DNSK_ABI_PROFILE=android16-6.12-xt128 DNSK_PAGE_SIZE=4096 \
            DNSK_MAX_SKB_FRAGS=17 DNSK_CGROUP_SUBSYS_COUNT=8 modules
          mkdir -p out
          cp "$GITHUB_WORKSPACE"/*.ko out/
          cp "$GITHUB_WORKSPACE"/features/*/*.ko out/
          OBJCOPY=$(command -v llvm-objcopy || command -v aarch64-linux-gnu-objcopy || command -v objcopy)
          "$OBJCOPY" -O binary -R .note -R .note.gnu.build-id -R .comment -S "$KDIR/vmlinux" out/Image
          cp "$KDIR/System.map" out/
          cp "$KDIR/.config" out/kernel.config
          grep -E '^CONFIG_(DEVTMPFS|SERIAL_AMBA_PL011|MODULE_SIG|MODULE_SIG_FORCE|MODULE_SIG_ALL|VIRTIO|9P_FS|KALLSYMS|CFI_CLANG|PID_NS|IPC_NS|SYSVIPC|NF_TABLES|IP_SET)=' \
            "$KDIR/.config" || true
          ls -l out
      # Only the oracle-nopids image is ccache-optimized: GitHub's free cache
      # budget is 10 GiB.  Forks can change the condition/key for their own
      # target; stock/native oracle deliberately stay uncached.
      - name: Restore ccache (oracle-nopids only)
        if: ${{ inputs.kernel == 'oracle-nopids' }}
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ runner.os }}-android16-6.12-oracle-nopids-${{ hashFiles('.github/workflows/qemu-core.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-android16-6.12-oracle-nopids-
      - name: Build Native oracle Image
        if: ${{ inputs.kernel == 'oracle' || inputs.kernel == 'oracle-nopids' }}
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev dwarves ccache
          KDIR="/opt/ddk/kdir/android16-6.12"
          SRC="/opt/ddk/src/android16-6.12"
          test -x "$SRC/scripts/config"
          # Base the oracle on the actual device config (extracted from the
          # beryl boot image), then apply only explicit test deltas below.
          zcat "$GITHUB_WORKSPACE/profiles/device/beryl-6.12.30.config.gz" > "$KDIR/.config"
          "$SRC/scripts/config" --file "$KDIR/.config" \
            -e NAMESPACES -e UTS_NS -e IPC_NS -e PID_NS -e NET_NS -e USER_NS \
            -e POSIX_MQUEUE -e POSIX_MQUEUE_SYSCTL -e SYSVIPC -e SYSVIPC_SYSCTL \
            -e CGROUPS -e CGROUP_PIDS -e MEMCG -e CGROUP_BPF -e PSI \
            -e DEVTMPFS -e DEVTMPFS_MOUNT -e NF_TABLES -e NF_TABLES_INET \
            -e NF_TABLES_IPV4 -e NF_TABLES_IPV6 -e NFT_NAT -e NFT_CHAIN_NAT \
            -e NFT_COMPAT -e NF_NAT -e NF_NAT_MASQUERADE \
            -e IP_NF_IPTABLES -e IP_NF_FILTER -e IP_NF_NAT \
            -e IP_NF_TARGET_MASQUERADE -e NETFILTER_XTABLES \
            -e IP_SET -e IP_SET_HASH_IP -e IP_SET_HASH_NET -e NETFILTER_XT_SET \
            -e NETFILTER_XT_MATCH_ADDRTYPE -e NETFILTER_XT_TARGET_REJECT \
            -e NETFILTER_XT_MATCH_RECENT \
            -e TMPFS_XATTR -e TMPFS_POSIX_ACL -e FUSE_FS -e OVERLAY_FS \
            -e VETH -e BRIDGE -e VIRTIO_NET -e VIRTIO_PCI -e VIRTIO_BLK \
            -e SECCOMP -e SECCOMP_FILTER -d MODULE_SIG_FORCE -d MODULE_SIG \
            -d TRIM_UNUSED_KSYMS -d MODULE_SIG_ALL -d MODULE_SIG_PROTECT \
            --set-str MODULE_SIG_PROTECT_LIST ""
          if [ "${{ inputs.kernel }}" = "oracle-nopids" ]; then
            "$SRC/scripts/config" --file "$KDIR/.config" -d CGROUP_PIDS
          fi
          make -C "$SRC" O="$KDIR" ARCH=arm64 LLVM=1 olddefconfig
          grep -E '^CONFIG_(IPC_NS|PID_NS|USER_NS|POSIX_MQUEUE|CGROUP_PIDS|DEVTMPFS|NF_TABLES|IP_SET)=' "$KDIR/.config"
          if [ "${{ inputs.kernel }}" = "oracle-nopids" ]; then
            export CCACHE_DIR=/tmp/ccache CCACHE_MAXSIZE=4G CCACHE_BASEDIR="$SRC"
            ccache -M 4G || true
            CC_WRAP="ccache "
          else
            CC_WRAP=""
          fi
          # Building Image rebuilds modpost from this source tree.  The shipped
          # DDK binary emits a valid empty string literal for an empty
          # __version_ext_names table, but this source writes "= ;", which
          # clang rejects in every external module.  Patch the generator and
          # rebuild it before Image so the external build picks up the fix.
          python3 - <<'PY'
          p = "/opt/ddk/src/android16-6.12/scripts/mod/modpost.c"
          s = open(p).read()
          old = ('\tbuf_printf(b, "__used __section(\\"__version_ext_names\\") =\\n");\n'
                 '\tlist_for_each_entry(s, &mod->unresolved_symbols, list) {')
          new = ('\tbuf_printf(b, "__used __section(\\"__version_ext_names\\") =");\n'
                 '\t{\n'
                 '\t\tstruct symbol *t;\n'
                 '\t\tbool any = false;\n'
                 '\n'
                 '\t\tlist_for_each_entry(t, &mod->unresolved_symbols, list)\n'
                 '\t\t\tif (t->module && t->crc_valid) { any = true; break; }\n'
                 '\t\tbuf_printf(b, any ? "\\n" : " \\"\\"\\n");\n'
                 '\t}\n'
                 '\tlist_for_each_entry(s, &mod->unresolved_symbols, list) {')
          assert old in s, "add_extended_versions pattern not found"
          open(p, "w").write(s.replace(old, new, 1))
          PY
          make -C "$SRC" O="$KDIR" ARCH=arm64 LLVM=1 scripts/mod/modpost
          make -C "$SRC" O="$KDIR" ARCH=arm64 LLVM=1 CC="${CC_WRAP}clang" \
            -j"$(nproc)" Image
          mkdir -p out
          if [ "${{ inputs.kernel }}" = "oracle-nopids" ]; then
            eval "$(python3 "$GITHUB_WORKSPACE/tools/build_flags.py" \
              --profile "$GITHUB_WORKSPACE/profiles/abi/android16-6.12-xt128.json" \
              --kmi android16-6.12)"
            export DNSK_ABI_PROFILE DNSK_PAGE_SIZE DNSK_MAX_SKB_FRAGS \
              DNSK_CGROUP_SUBSYS_COUNT DNSK_CGROUP_SUBSYS_LAYOUT \
              DNSK_CGROUP_SUBSYS_CAN_FORK DNSK_CGROUP_SUBSYS_CANCEL_FORK \
              DNSK_CGROUP_SUBSYS_FORK DNSK_CGROUP_SUBSYS_EXIT \
              DNSK_CGROUP_SUBSYS_RELEASE DNSK_CGROUP_SUBSYS_ID \
              DNSK_SEQ_FILE_PRIVATE
            # External-module modpost reads only $(objtree)/Module.symvers.
            # The DDK tree may ship one that lacks the vmlinux CRCs; merge
            # vmlinux.symvers in, keeping one entry per symbol so modpost
            # does not report overlapping exports twice.
            touch "$KDIR/Module.symvers"
            cat "$KDIR/vmlinux.symvers" "$KDIR/Module.symvers" | \
              awk '!seen[$2]++' > "$KDIR/Module.symvers.merged"
            mv "$KDIR/Module.symvers.merged" "$KDIR/Module.symvers"
            make -C "$KDIR" M="$GITHUB_WORKSPACE" modules || {
              sed -n '1,60p' "$GITHUB_WORKSPACE/dnsk_core.mod.c" || true
              exit 1
            }
            make -C "$GITHUB_WORKSPACE/features/cgpids" KDIR="$KDIR" \
              KBUILD_EXTRA_SYMBOLS="$GITHUB_WORKSPACE/Module.symvers" \
              modules
            cp "$GITHUB_WORKSPACE/dnsk_core.ko" "$GITHUB_WORKSPACE/features/cgpids/dnsk_cgpids.ko" out/
          fi
          mkdir -p out
          OBJCOPY=$(command -v llvm-objcopy || command -v aarch64-linux-gnu-objcopy || command -v objcopy)
          "$OBJCOPY" -O binary -R .note -R .note.gnu.build-id -R .comment -S "$KDIR/vmlinux" out/Image
          cp "$KDIR/System.map" out/
          cp "$KDIR/.config" out/kernel.config
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-6.12
          path: out/*
          if-no-files-found: error

  boot:
    needs: image
    if: ${{ always() && (needs.image.result == 'success' || inputs.image_run_id != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ inputs.image_run_id == '' }}
        with:
          name: qemu-6.12
          path: qemu
      - uses: actions/download-artifact@v4
        if: ${{ inputs.image_run_id != '' }}
        with:
          name: qemu-6.12
          path: qemu
          run-id: ${{ inputs.image_run_id }}
          github-token: ${{ github.token }}
      - name: Install QEMU
        run: |
          PKGS="qemu-system-arm qemu-system-common qemu-system-data qemu-efi-aarch64 ipxe-qemu ipxe-qemu-256k-compat-efi-roms cpio"
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
          if ! sudo timeout 300 apt-get $APT_OPTS install -y --no-install-recommends $PKGS; then
            sudo timeout 180 apt-get $APT_OPTS update
            sudo timeout 300 apt-get $APT_OPTS install -y --no-install-recommends $PKGS
          fi
      - name: Build initramfs
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL -o alpine.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz
          mkdir -p rootfs
          tar -xzf alpine.tar.gz -C rootfs
          mkdir -p rootfs/modules rootfs/proc rootfs/sys rootfs/dev rootfs/tmp
          for ko in qemu/dnsk_*.ko; do
            [ -e "$ko" ] && cp "$ko" rootfs/modules/
          done
          curl -fsSL -o libmnl.apk \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libmnl-1.0.5-r2.apk
          curl -fsSL -o ipset.apk \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/ipset-7.21-r2.apk
          tar -xzf libmnl.apk -C rootfs 2>/dev/null
          tar -xzf ipset.apk -C rootfs 2>/dev/null
          if [ "${{ inputs.mode }}" = "docker" ]; then
            curl -fsSL -o docker.tgz \
              https://download.docker.com/linux/static/stable/aarch64/docker-29.7.2.tgz
            mkdir -p rootfs/opt rootfs/usr/bin
            tar -xzf docker.tgz -C rootfs/opt
            cp rootfs/opt/docker/* rootfs/usr/bin/
            cp alpine.tar.gz rootfs/alpine.tar.gz
            APK_BASE=https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64
            for pkg in iptables-1.8.10-r3 iptables-legacy-1.8.10-r3 \
                       libip4tc-1.8.10-r3 libip6tc-1.8.10-r3 \
                       libxtables-1.8.10-r3 libnftnl-1.2.6-r0 \
                       nftables-1.0.9-r2 gmp-6.3.0-r1 jansson-2.14-r4 \
                       readline-8.2.10-r0 libncursesw-6.4_p20240420-r2; do
              curl -fsSL -o "$pkg.apk" "$APK_BASE/$pkg.apk"
              tar -xzf "$pkg.apk" -C rootfs 2>/dev/null
            done
          fi
          if [ "${{ inputs.mode }}" = "baseline" ]; then
            cp tests/qemu/init rootfs/init
          else
            cp "tests/qemu/init-${{ inputs.mode }}" rootfs/init
          fi
          chmod 0755 rootfs/init
          (cd rootfs && find . | cpio -o -H newc | gzip -9) > initramfs.cpio.gz
          ls -l Image 2>/dev/null || ls -l qemu/Image
      - name: Boot and check
        shell: bash
        run: |
          set +e
          MEM=2048
          SMP=2
          TIMEOUT=420
          if [ "${{ inputs.mode }}" = "docker" ]; then
            MEM=3072
            SMP=4
            TIMEOUT=1200
          fi
          APPEND="console=ttyAMA0 earlycon=pl011,0x9000000 rdinit=/init panic=-1 nokaslr selinux=0 module.sig_enforce=0"
          if [ "${{ inputs.kernel }}" = "oracle-nopids" ]; then
            APPEND="$APPEND dnsk_lkm=1"
          fi
          if [ "${{ inputs.mode }}" = "cgpids" ] && [ "${{ inputs.kernel }}" = "oracle" ]; then
            APPEND="$APPEND cgpids_native=1"
          fi
          timeout "$TIMEOUT" qemu-system-aarch64 \
            -M virt -cpu max -m "$MEM" -smp "$SMP" -nographic -no-reboot \
            -kernel qemu/Image -initrd initramfs.cpio.gz \
            -append "$APPEND" \
            2>&1 | tee qemu.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "qemu_rc=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "QEMU did not exit cleanly" >&2
            exit 1
          fi
          grep -q 'DNSK_QEMU_OK' qemu.log
          if grep -Eq 'Kernel panic|Oops|BUG:|CFI failure|Unknown symbol|invalid module format|insmod: can.t insert' qemu.log; then
            echo "kernel failure in QEMU log" >&2
            exit 1
          fi
          echo "QEMU core/ns smoke ok"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-core-log-${{ inputs.mode }}
          path: qemu.log
          if-no-files-found: warn
