name: qemu-core

on:
  workflow_dispatch:
    inputs:
      mode:
        description: initramfs test to run
        type: choice
        options:
          - baseline
          - active-ns
          - active-netfilter
          - active-devtmpfs
          - active-ipset
          - cgpids
          - tmpfsx
          - userns
          - docker
          - diff
        default: baseline
      kernel:
        description: stock DDK kernel or Native oracle with container configs
        type: choice
        options:
          - stock
          - oracle
          - oracle-nopids
        default: stock
      image_run_id:
        description: reuse qemu-6.12 artifact from this run id (empty = build); diff mode uses the device-image run id providing device-boot instead
        required: false
        type: string
        default: ""
      oracle_image_run_id:
        description: diff mode only - qemu-core run id providing the oracle qemu-6.12 Image (empty = error; kernel input is ignored)
        required: false
        type: string
        default: ""
      enforce_selinux:
        description: load the device policy and run the oracle tests enforcing
        type: boolean
        default: false
      module_run_id:
        description: ci-fast run id (userns=true, xt104 profile) providing selpermissive.ko for the enforcing pass and every feature module for diff mode
        required: false
        type: string
        default: ""
      module_layout_crc:
        description: diff mode only - device module_layout CRC used by the vermagic patch
        required: false
        type: string
        default: "0xe976b219"
      include_net:
        description: diff mode only - include netfilter/ipset probes (temporarily off until the net baseline is complete)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  image:
    # diff mode reuses two prebuilt Images; it must never build the qemu-6.12
    # artifact from image_run_id, which in that mode names a device-image run.
    if: ${{ inputs.mode != 'diff' && inputs.image_run_id == '' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Build modules and boot Image
        if: ${{ inputs.kernel == 'stock' }}
        shell: bash
        run: |
          set -euxo pipefail
          KDIR="/opt/ddk/kdir/android16-6.12"
          make -C "$KDIR" M="$GITHUB_WORKSPACE" modules
          make -C "$GITHUB_WORKSPACE/features/ns" KDIR="$KDIR" \
            DNSK_ABI_PROFILE=android16-6.12-xt128 DNSK_PAGE_SIZE=4096 \
            DNSK_MAX_SKB_FRAGS=17 DNSK_CGROUP_SUBSYS_COUNT=8 modules
          make -C "$GITHUB_WORKSPACE/features/diag" KDIR="$KDIR" modules
          make -C "$GITHUB_WORKSPACE/features/devtmpfs" KDIR="$KDIR" \
            DNSK_ABI_PROFILE=android16-6.12-xt128 DNSK_PAGE_SIZE=4096 \
            DNSK_MAX_SKB_FRAGS=17 DNSK_CGROUP_SUBSYS_COUNT=8 modules
          make -C "$GITHUB_WORKSPACE/features/netfilter" KDIR="$KDIR" \
            DNSK_ABI_PROFILE=android16-6.12-xt128 DNSK_PAGE_SIZE=4096 \
            DNSK_MAX_SKB_FRAGS=17 DNSK_CGROUP_SUBSYS_COUNT=8 modules
          make -C "$GITHUB_WORKSPACE/features/ipset" KDIR="$KDIR" \
            DNSK_ABI_PROFILE=android16-6.12-xt128 DNSK_PAGE_SIZE=4096 \
            DNSK_MAX_SKB_FRAGS=17 DNSK_CGROUP_SUBSYS_COUNT=8 modules
          mkdir -p out
          cp "$GITHUB_WORKSPACE"/*.ko out/
          cp "$GITHUB_WORKSPACE"/features/*/*.ko out/
          OBJCOPY=$(command -v llvm-objcopy || command -v aarch64-linux-gnu-objcopy || command -v objcopy)
          "$OBJCOPY" -O binary -R .note -R .note.gnu.build-id -R .comment -S "$KDIR/vmlinux" out/Image
          cp "$KDIR/System.map" out/
          cp "$KDIR/.config" out/kernel.config
          grep -E '^CONFIG_(DEVTMPFS|SERIAL_AMBA_PL011|MODULE_SIG|MODULE_SIG_FORCE|MODULE_SIG_ALL|VIRTIO|9P_FS|KALLSYMS|CFI_CLANG|PID_NS|IPC_NS|SYSVIPC|NF_TABLES|IP_SET)=' \
            "$KDIR/.config" || true
          ls -l out
      # Only the oracle-nopids image is ccache-optimized: GitHub's free cache
      # budget is 10 GiB.  Forks can change the condition/key for their own
      # target; stock/native oracle deliberately stay uncached.
      - name: Restore ccache (oracle-nopids only)
        if: ${{ inputs.kernel == 'oracle-nopids' }}
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ runner.os }}-android16-6.12-oracle-nopids-${{ hashFiles('.github/workflows/qemu-core.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-android16-6.12-oracle-nopids-
      - name: Build Native oracle Image
        if: ${{ inputs.kernel == 'oracle' || inputs.kernel == 'oracle-nopids' }}
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev dwarves ccache
          KDIR="/opt/ddk/kdir/android16-6.12"
          SRC="/opt/ddk/src/android16-6.12"
          test -x "$SRC/scripts/config"
          # Base the oracle on the actual device config (extracted from the
          # beryl boot image), then apply only explicit test deltas below.
          zcat "$GITHUB_WORKSPACE/profiles/device/beryl-6.12.30.config.gz" > "$KDIR/.config"
          "$SRC/scripts/config" --file "$KDIR/.config" \
            -e NAMESPACES -e UTS_NS -e IPC_NS -e PID_NS -e NET_NS -e USER_NS \
            -e POSIX_MQUEUE -e POSIX_MQUEUE_SYSCTL -e SYSVIPC -e SYSVIPC_SYSCTL \
            -e CGROUPS -e CGROUP_PIDS -e MEMCG -e CGROUP_BPF -e PSI \
            -e DEVTMPFS -e DEVTMPFS_MOUNT -e NF_TABLES -e NF_TABLES_INET \
            -e NF_TABLES_IPV4 -e NF_TABLES_IPV6 -e NFT_NAT -e NFT_CHAIN_NAT \
            -e NFT_COMPAT -e NF_NAT -e NF_NAT_MASQUERADE \
            -e IP_NF_IPTABLES -e IP_NF_FILTER -e IP_NF_NAT \
            -e IP_NF_TARGET_MASQUERADE -e NETFILTER_XTABLES \
            -e IP_SET -e IP_SET_HASH_IP -e IP_SET_HASH_NET -e NETFILTER_XT_SET \
            -e NETFILTER_XT_MATCH_ADDRTYPE -e NETFILTER_XT_TARGET_REJECT \
            -e NETFILTER_XT_MATCH_RECENT \
            -e TMPFS -e TMPFS_XATTR -e TMPFS_POSIX_ACL -e FS_POSIX_ACL \
            -e FUSE_FS -e OVERLAY_FS \
            -e VETH -e BRIDGE -e VIRTIO_NET -e VIRTIO_PCI -e VIRTIO_BLK \
            -e SECCOMP -e SECCOMP_FILTER -d MODULE_SIG_FORCE -d MODULE_SIG \
            -d TRIM_UNUSED_KSYMS -d MODULE_SIG_ALL -d MODULE_SIG_PROTECT \
            --set-str MODULE_SIG_PROTECT_LIST ""
          if [ "${{ inputs.kernel }}" = "oracle-nopids" ]; then
            "$SRC/scripts/config" --file "$KDIR/.config" -d CGROUP_PIDS
          fi
          make -C "$SRC" O="$KDIR" ARCH=arm64 LLVM=1 olddefconfig
          grep -E '^CONFIG_(IPC_NS|PID_NS|USER_NS|POSIX_MQUEUE|CGROUP_PIDS|DEVTMPFS|NF_TABLES|IP_SET)=' "$KDIR/.config"
          if [ "${{ inputs.kernel }}" = "oracle-nopids" ]; then
            export CCACHE_DIR=/tmp/ccache CCACHE_MAXSIZE=4G CCACHE_BASEDIR="$SRC"
            ccache -M 4G || true
            CC_WRAP="ccache "
          else
            CC_WRAP=""
          fi
          # Building Image rebuilds modpost from this source tree.  The shipped
          # DDK binary emits a valid empty string literal for an empty
          # __version_ext_names table, but this source writes "= ;", which
          # clang rejects in every external module.  Patch the generator and
          # rebuild it before Image so the external build picks up the fix.
          python3 - <<'PY'
          p = "/opt/ddk/src/android16-6.12/scripts/mod/modpost.c"
          s = open(p).read()
          old = ('\tbuf_printf(b, "__used __section(\\"__version_ext_names\\") =\\n");\n'
                 '\tlist_for_each_entry(s, &mod->unresolved_symbols, list) {')
          new = ('\tbuf_printf(b, "__used __section(\\"__version_ext_names\\") =");\n'
                 '\t{\n'
                 '\t\tstruct symbol *t;\n'
                 '\t\tbool any = false;\n'
                 '\n'
                 '\t\tlist_for_each_entry(t, &mod->unresolved_symbols, list)\n'
                 '\t\t\tif (t->module && t->crc_valid) { any = true; break; }\n'
                 '\t\tbuf_printf(b, any ? "\\n" : " \\"\\"\\n");\n'
                 '\t}\n'
                 '\tlist_for_each_entry(s, &mod->unresolved_symbols, list) {')
          assert old in s, "add_extended_versions pattern not found"
          open(p, "w").write(s.replace(old, new, 1))
          PY
          make -C "$SRC" O="$KDIR" ARCH=arm64 LLVM=1 scripts/mod/modpost
          make -C "$SRC" O="$KDIR" ARCH=arm64 LLVM=1 CC="${CC_WRAP}clang" \
            -j"$(nproc)" Image
          mkdir -p out
          if [ "${{ inputs.kernel }}" = "oracle-nopids" ]; then
            eval "$(python3 "$GITHUB_WORKSPACE/tools/build_flags.py" \
              --profile "$GITHUB_WORKSPACE/profiles/abi/android16-6.12-xt128.json" \
              --kmi android16-6.12)"
            export DNSK_ABI_PROFILE DNSK_PAGE_SIZE DNSK_MAX_SKB_FRAGS \
              DNSK_CGROUP_SUBSYS_COUNT DNSK_CGROUP_SUBSYS_LAYOUT \
              DNSK_CGROUP_SUBSYS_CAN_FORK DNSK_CGROUP_SUBSYS_CANCEL_FORK \
              DNSK_CGROUP_SUBSYS_FORK DNSK_CGROUP_SUBSYS_EXIT \
              DNSK_CGROUP_SUBSYS_RELEASE DNSK_CGROUP_SUBSYS_ID \
              DNSK_SEQ_FILE_PRIVATE
            # External-module modpost reads only $(objtree)/Module.symvers.
            # The DDK tree may ship one that lacks the vmlinux CRCs; merge
            # vmlinux.symvers in, keeping one entry per symbol so modpost
            # does not report overlapping exports twice.
            touch "$KDIR/Module.symvers"
            cat "$KDIR/vmlinux.symvers" "$KDIR/Module.symvers" | \
              awk '!seen[$2]++' > "$KDIR/Module.symvers.merged"
            mv "$KDIR/Module.symvers.merged" "$KDIR/Module.symvers"
            make -C "$KDIR" M="$GITHUB_WORKSPACE" modules || {
              sed -n '1,60p' "$GITHUB_WORKSPACE/dnsk_core.mod.c" || true
              exit 1
            }
            make -C "$GITHUB_WORKSPACE/features/cgpids" KDIR="$KDIR" \
              KBUILD_EXTRA_SYMBOLS="$GITHUB_WORKSPACE/Module.symvers" \
              modules
            cp "$GITHUB_WORKSPACE/dnsk_core.ko" "$GITHUB_WORKSPACE/features/cgpids/dnsk_cgpids.ko" out/
          fi
          mkdir -p out
          OBJCOPY=$(command -v llvm-objcopy || command -v aarch64-linux-gnu-objcopy || command -v objcopy)
          "$OBJCOPY" -O binary -R .note -R .note.gnu.build-id -R .comment -S "$KDIR/vmlinux" out/Image
          cp "$KDIR/System.map" out/
          cp "$KDIR/.config" out/kernel.config
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-6.12
          path: out/*
          if-no-files-found: error

  boot:
    needs: image
    if: ${{ inputs.mode != 'diff' && always() && (needs.image.result == 'success' || inputs.image_run_id != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ inputs.image_run_id == '' }}
        with:
          name: qemu-6.12
          path: qemu
      - uses: actions/download-artifact@v4
        if: ${{ inputs.image_run_id != '' }}
        with:
          name: qemu-6.12
          path: qemu
          run-id: ${{ inputs.image_run_id }}
          github-token: ${{ github.token }}
      - name: Install QEMU
        run: |
          PKGS="qemu-system-arm qemu-system-common qemu-system-data qemu-efi-aarch64 ipxe-qemu ipxe-qemu-256k-compat-efi-roms cpio gcc-aarch64-linux-gnu libc6-dev-arm64-cross"
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
          if ! sudo timeout 300 apt-get $APT_OPTS install -y --no-install-recommends $PKGS; then
            sudo timeout 180 apt-get $APT_OPTS update
            sudo timeout 300 apt-get $APT_OPTS install -y --no-install-recommends $PKGS
          fi
      - name: Build initramfs
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL -o alpine.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz
          mkdir -p rootfs
          tar -xzf alpine.tar.gz -C rootfs
          mkdir -p rootfs/modules rootfs/proc rootfs/sys rootfs/dev rootfs/tmp
          chmod 1777 rootfs/tmp
          for ko in qemu/dnsk_*.ko; do
            [ -e "$ko" ] && cp "$ko" rootfs/modules/
          done
          curl -fsSL -o libmnl.apk \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/libmnl-1.0.5-r2.apk
          curl -fsSL -o ipset.apk \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/ipset-7.21-r2.apk
          tar -xzf libmnl.apk -C rootfs 2>/dev/null
          tar -xzf ipset.apk -C rootfs 2>/dev/null
          if [ "${{ inputs.mode }}" = "docker" ]; then
            curl -fsSL -o docker.tgz \
              https://download.docker.com/linux/static/stable/aarch64/docker-29.7.2.tgz
            mkdir -p rootfs/opt rootfs/usr/bin
            tar -xzf docker.tgz -C rootfs/opt
            cp rootfs/opt/docker/* rootfs/usr/bin/
            cp alpine.tar.gz rootfs/alpine.tar.gz
            APK_BASE=https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64
            for pkg in iptables-1.8.10-r3 iptables-legacy-1.8.10-r3 \
                       libip4tc-1.8.10-r3 libip6tc-1.8.10-r3 \
                       libxtables-1.8.10-r3 libnftnl-1.2.6-r0 \
                       nftables-1.0.9-r2 gmp-6.3.0-r1 jansson-2.14-r4 \
                       readline-8.2.10-r0 libncursesw-6.4_p20240420-r2; do
              curl -fsSL -o "$pkg.apk" "$APK_BASE/$pkg.apk"
              tar -xzf "$pkg.apk" -C rootfs 2>/dev/null
            done
          fi
          if [ "${{ inputs.mode }}" = "tmpfsx" ]; then
            aarch64-linux-gnu-gcc -static -O2 -o xattr_test tests/qemu/xattr_test.c
            aarch64-linux-gnu-gcc -static -O2 -o acl_test tests/qemu/acl_test.c
            cp xattr_test acl_test rootfs/
            cp tests/qemu/init-tmpfsx-oracle rootfs/init
          elif [ "${{ inputs.mode }}" = "userns" ]; then
            aarch64-linux-gnu-gcc -static -O2 -o userns_test tests/qemu/userns_test.c
            aarch64-linux-gnu-gcc -static -O2 -o userns_unpriv_test \
              tests/qemu/userns_unpriv_test.c
            aarch64-linux-gnu-gcc -static -O2 -o fuse_test tests/qemu/fuse_test.c
            aarch64-linux-gnu-gcc -static -O2 -pthread -o mount_setattr_test \
              tests/qemu/selftests/mount_setattr/mount_setattr_test.c
            cp userns_test userns_unpriv_test fuse_test mount_setattr_test rootfs/
            curl -fsSL -o apk-tools.apk \
              https://dl-cdn.alpinelinux.org/alpine/v3.20/main/x86_64/apk-tools-static-2.14.13-r0.apk
            rm -rf /tmp/apk-tools && mkdir -p /tmp/apk-tools
            tar -xzf apk-tools.apk -C /tmp/apk-tools
            /tmp/apk-tools/sbin/apk.static --root "$PWD/rootfs" \
              --arch aarch64 --no-cache --allow-untrusted --no-scripts \
              --repository https://dl-cdn.alpinelinux.org/alpine/v3.20/main \
              add e2fsprogs
            cp tests/qemu/init-userns-oracle rootfs/init
          elif [ "${{ inputs.mode }}" = "baseline" ]; then
            cp tests/qemu/init rootfs/init
          else
            cp "tests/qemu/init-${{ inputs.mode }}" rootfs/init
          fi
          chmod 0755 rootfs/init
          if [ "${{ inputs.enforce_selinux }}" = "true" ]; then
            cp -a tests/qemu/assets/android/. rootfs/
            chmod 0755 rootfs/system/bin/linker64
            rm -f rootfs/system/etc/ld.config.txt
            cp tests/qemu/assets/ksud rootfs/ksud
            chmod 0755 rootfs/ksud
            aarch64-linux-gnu-gcc -static -O2 -o selinux_load tests/qemu/selinux_load.c
            cp selinux_load rootfs/selinux_load
            cp tests/qemu/assets/selinux-precompiled-sepolicy.gz rootfs/policy.gz
            if [ -n "${{ inputs.module_run_id }}" ]; then
              mkdir -p /tmp/mods
              GH_TOKEN="${{ github.token }}" gh run download \
                "${{ inputs.module_run_id }}" -n core-android16-6.12 -D /tmp/mods || true
              if [ -f /tmp/mods/selpermissive.ko ]; then
                mkdir -p rootfs/modules
                cp /tmp/mods/selpermissive.ko rootfs/modules/
              fi
            fi
            aarch64-linux-gnu-gcc -static -O2 -o exec_shell_su tests/qemu/exec_shell_su.c
            cp exec_shell_su rootfs/
            aarch64-linux-gnu-gcc -static -O2 -o insmod_force tests/qemu/insmod_force.c
            cp insmod_force rootfs/
            touch rootfs/enforce
          fi
          (cd rootfs && find . | cpio -o -H newc | gzip -9) > initramfs.cpio.gz
          ls -l Image 2>/dev/null || ls -l qemu/Image
      - name: Boot and check
        shell: bash
        run: |
          set +e
          MEM=2048
          SMP=2
          TIMEOUT=420
          if [ "${{ inputs.mode }}" = "docker" ]; then
            MEM=3072
            SMP=4
            TIMEOUT=1200
          fi
          APPEND="console=ttyAMA0 earlycon=pl011,0x9000000 rdinit=/init panic=-1 nokaslr selinux=0 module.sig_enforce=0"
          if [ "${{ inputs.kernel }}" = "oracle-nopids" ]; then
            APPEND="$APPEND dnsk_lkm=1"
          fi
          if [ "${{ inputs.mode }}" = "cgpids" ] && [ "${{ inputs.kernel }}" = "oracle" ]; then
            APPEND="$APPEND cgpids_native=1"
          fi
          timeout "$TIMEOUT" qemu-system-aarch64 \
            -M virt -cpu max -m "$MEM" -smp "$SMP" -nographic -no-reboot \
            -kernel qemu/Image -initrd initramfs.cpio.gz \
            -append "$APPEND" \
            2>&1 | tee qemu.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "qemu_rc=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "QEMU did not exit cleanly" >&2
            exit 1
          fi
          grep -q 'DNSK_QEMU_OK' qemu.log
          if [ "${{ inputs.mode }}" = "tmpfsx" ]; then
            grep -q 'DNSK_TMPFSX_ACL_INHERIT_OK' qemu.log
            grep -q 'DNSK_TMPFSX_ACL_LEGACY_INHERIT_OK' qemu.log
            grep -q 'DNSK_TMPFSX_OK' qemu.log
            if [ "${{ inputs.enforce_selinux }}" = "true" ]; then
              grep -q 'DNSK_TMPFSX_ENFORCE_OK' qemu.log
            fi
          fi
          if [ "${{ inputs.mode }}" = "userns" ]; then
            grep -q 'DNSK_OVL_INIT_NS=0' qemu.log
            grep -q 'DNSK_USERNS_UNPRIV_OK' qemu.log
            grep -q 'DNSK_MOUNT_SETATTR_SELFTEST_OK' qemu.log
            grep -q 'DNSK_USERNS_OK' qemu.log
          fi
          if grep -Eq 'Kernel panic|Oops|BUG:|CFI failure|Unknown symbol|invalid module format|insmod: can.t insert' qemu.log; then
            echo "kernel failure in QEMU log" >&2
            exit 1
          fi
          echo "QEMU core/ns smoke ok"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-core-log-${{ inputs.mode }}
          path: qemu.log
          if-no-files-found: warn

  # Semantic differential: boot the device kernel with the suite loaded and the
  # native oracle built with the same configs, then compare the probe output.
  # Both Images are inputs and are never built here: image_run_id names a
  # device-image run (device-boot artifact) and oracle_image_run_id names a
  # qemu-core run (qemu-6.12 artifact), so the two expensive Images are reused
  # independently.  Feature modules come from a ci-fast run.
  diff:
    if: ${{ inputs.mode == 'diff' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require both Image run ids and the module run
        env:
          DEVICE_RUN: ${{ inputs.image_run_id }}
          ORACLE_RUN: ${{ inputs.oracle_image_run_id }}
          MODULE_RUN: ${{ inputs.module_run_id }}
        run: |
          set -euo pipefail
          : "${DEVICE_RUN:?image_run_id must name the device-image run providing device-boot}"
          : "${ORACLE_RUN:?oracle_image_run_id must name the qemu-core run providing qemu-6.12}"
          : "${MODULE_RUN:?module_run_id must name the ci-fast run providing the modules}"
      - uses: actions/checkout@v4
      - name: Download the device Image
        uses: actions/download-artifact@v4
        with:
          name: device-boot
          path: device
          run-id: ${{ inputs.image_run_id }}
          github-token: ${{ github.token }}
      - name: Download the oracle Image
        uses: actions/download-artifact@v4
        with:
          name: qemu-6.12
          path: oracle
          run-id: ${{ inputs.oracle_image_run_id }}
          github-token: ${{ github.token }}
      - name: Download the feature modules
        uses: actions/download-artifact@v4
        with:
          name: core-android16-6.12
          path: modules
          run-id: ${{ inputs.module_run_id }}
          github-token: ${{ github.token }}
      - name: Validate the downloaded Images
        run: |
          set -euxo pipefail
          test -s device/Image
          test -s oracle/Image
          # Refuse a stock or oracle-nopids artifact: the differential's oracle
          # must have every feature compiled in, CGROUP_PIDS included.  Passing
          # the wrong run id would otherwise compare "feature absent" against
          # "feature absent" and look green.
          for c in USER_NS PID_NS IPC_NS CGROUP_PIDS DEVTMPFS CGROUPS \
                   TMPFS_XATTR TMPFS_POSIX_ACL SYSVIPC POSIX_MQUEUE; do
            grep -q "^CONFIG_${c}=y" oracle/kernel.config || {
              echo "oracle artifact is not a full native oracle (CONFIG_${c} is not y)" >&2
              exit 1
            }
          done
      - name: Install QEMU and toolchain
        run: |
          APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=5"
          PKGS="qemu-system-arm qemu-system-common qemu-system-data ipxe-qemu
            ipxe-qemu-256k-compat-efi-roms qemu-efi-aarch64 cpio
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu kmod"
          sudo timeout 900 apt-get $APT_OPTS update
          sudo timeout 900 apt-get $APT_OPTS install -y --no-install-recommends $PKGS
      - name: Patch module vermagic for the device Image
        env:
          MODULE_LAYOUT_CRC: ${{ inputs.module_layout_crc }}
        run: |
          set -euxo pipefail
          RELEASE=$(awk '{print $1}' device/release.txt 2>/dev/null || true)
          test -n "$RELEASE"
          VERMAGIC="$RELEASE SMP preempt mod_unload modversions aarch64"
          echo "target vermagic: $VERMAGIC"
          for ko in modules/*.ko; do
            aarch64-linux-gnu-objcopy --dump-section .modinfo=modinfo.bin "$ko"
            python3 - "$VERMAGIC" <<'PY'
          import sys
          magic = sys.argv[1].encode()
          data = open('modinfo.bin', 'rb').read()
          out = []
          found = False
          for entry in data.split(b'\0'):
              if entry.startswith(b'vermagic='):
                  out.append(b'vermagic=' + magic)
                  found = True
              elif entry:
                  out.append(entry)
          if not found:
              out.append(b'vermagic=' + magic)
          open('modinfo.new', 'wb').write(b'\0'.join(out) + b'\0')
          PY
            aarch64-linux-gnu-objcopy --update-section .modinfo=modinfo.new "$ko"
            modinfo -F vermagic "$ko"
            aarch64-linux-gnu-objcopy --dump-section __versions=versions.bin "$ko"
            python3 - "$MODULE_LAYOUT_CRC" <<'PY'
          import struct, sys
          crc = int(sys.argv[1], 16)
          data = bytearray(open('versions.bin', 'rb').read())
          found = False
          for i in range(0, len(data) - 64 + 1, 64):
              if data[i + 8:i + 64].split(b'\0')[0] == b'module_layout':
                  struct.pack_into('<Q', data, i, crc)
                  found = True
                  break
          if not found:
              data += struct.pack('<Q', crc) + b'module_layout'
              data += b'\0' * (64 - 8 - len(b'module_layout'))
          print('module_layout entry', 'updated' if found else 'added', hex(crc))
          open('versions.new', 'wb').write(data)
          PY
            aarch64-linux-gnu-objcopy --update-section __versions=versions.new "$ko"
          done
      - name: Build probe binaries
        run: |
          set -euxo pipefail
          aarch64-linux-gnu-gcc -static -O2 -o ipc_probe tests/qemu/ipc_probe.c
          aarch64-linux-gnu-gcc -static -O2 -o xattr_probe tests/qemu/xattr_probe.c
          aarch64-linux-gnu-gcc -static -O2 -o acl_test tests/qemu/acl_test.c
          aarch64-linux-gnu-gcc -static -O2 -o userns_test tests/qemu/userns_test.c
          aarch64-linux-gnu-gcc -static -O2 -o userns_unpriv_test \
            tests/qemu/userns_unpriv_test.c
          aarch64-linux-gnu-gcc -static -O2 -o pids_probe tests/qemu/pids_probe.c
          aarch64-linux-gnu-gcc -static -O2 -o ipcns_leak tests/qemu/ipcns_leak.c
          aarch64-linux-gnu-gcc -static -O2 -o setns_pidfd_probe \
            tests/qemu/setns_pidfd_probe.c
          aarch64-linux-gnu-gcc -static -O2 -o fuse_test tests/qemu/fuse_test.c
          aarch64-linux-gnu-gcc -static -O2 -o selinux_load tests/qemu/selinux_load.c
          aarch64-linux-gnu-gcc -static -O2 -o insmod_force tests/qemu/insmod_force.c
          aarch64-linux-gnu-gcc -static -O2 -o dnsk-preflight tools/dnsk_preflight.c
      - name: Assemble oracle and LKM initramfs
        env:
          INCLUDE_NET: ${{ inputs.include_net }}
        run: |
          set -euxo pipefail
          curl -fsSL -o alpine.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz
          build_rootfs() {
            rm -rf "$1"
            mkdir -p "$1"
            tar -xzf alpine.tar.gz -C "$1"
            mkdir -p "$1/proc" "$1/sys" "$1/dev" "$1/tmp" "$1/modules"
            chmod 1777 "$1/tmp"
          }
          build_rootfs oracle-rootfs
          cp ipc_probe xattr_probe acl_test userns_test userns_unpriv_test \
            pids_probe ipcns_leak setns_pidfd_probe fuse_test oracle-rootfs/
          cp tests/qemu/diff_probe.sh tests/qemu/init-diff-oracle oracle-rootfs/
          chmod 0755 oracle-rootfs/init oracle-rootfs/diff_probe.sh

          build_rootfs lkm-rootfs
          MODROOT=lkm-rootfs/data/adb/modules/droid_lkm_suite
          mkdir -p "$MODROOT/kmi/android16-6.12" "$MODROOT/bin"
          cp ksu/policy.conf ksu/supported_kmis.txt "$MODROOT/"
          cp tools/dnskctl "$MODROOT/bin/dnskctl"
          cp dnsk-preflight "$MODROOT/bin/dnsk-preflight"
          chmod 0755 "$MODROOT/bin/dnskctl" "$MODROOT/bin/dnsk-preflight"
          cp modules/*.ko "$MODROOT/kmi/android16-6.12/"
          cp modules/selpermissive.ko lkm-rootfs/modules/
          cp ipc_probe xattr_probe acl_test userns_test userns_unpriv_test \
            pids_probe ipcns_leak setns_pidfd_probe fuse_test lkm-rootfs/
          cp selinux_load insmod_force lkm-rootfs/
          cp tests/qemu/diff_probe.sh tests/qemu/init-diff-lkm lkm-rootfs/
          chmod 0755 lkm-rootfs/init lkm-rootfs/diff_probe.sh
          cp tests/qemu/assets/ksud lkm-rootfs/ksud
          chmod 0755 lkm-rootfs/ksud
          cp -a tests/qemu/assets/android/. lkm-rootfs/
          chmod 0755 lkm-rootfs/system/bin/linker64
          cp tests/qemu/assets/selinux-precompiled-sepolicy.gz lkm-rootfs/policy.gz

          if [ "$INCLUDE_NET" = "true" ]; then
            # Deferred net probes need the legacy backends in both guest
            # rootfs.  Same cross-installed aarch64 apks the device netfilter
            # gate uses, minus the nft backend the device kernel lacks.
            mkdir -p netpkg
            APK_BASE=https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64
            for pkg in libmnl-1.0.5-r2 ipset-7.21-r2 iptables-legacy-1.8.10-r3 \
                       libip4tc-1.8.10-r3 libip6tc-1.8.10-r3 libxtables-1.8.10-r3; do
              curl -fsSL -o "$pkg.apk" "$APK_BASE/$pkg.apk"
              tar -xzf "$pkg.apk" -C netpkg 2>/dev/null || true
            done
            cp -a netpkg/. oracle-rootfs/
            cp -a netpkg/. lkm-rootfs/
          fi

          (cd oracle-rootfs && find . | cpio -o -H newc | gzip -9) > oracle-initramfs.cpio.gz
          (cd lkm-rootfs && find . | cpio -o -H newc | gzip -9) > lkm-initramfs.cpio.gz
          ls -l oracle/Image device/Image oracle-initramfs.cpio.gz lkm-initramfs.cpio.gz
      - name: Boot the oracle and the device kernel
        env:
          INCLUDE_NET: ${{ inputs.include_net }}
        run: |
          set +e
          COMMON="console=ttyAMA0 earlycon=pl011,0x9000000 rdinit=/init panic=-1 nokaslr module.sig_enforce=0"
          NET_FLAG=""
          if [ "$INCLUDE_NET" = "true" ]; then
            NET_FLAG="dnsk_diff_net=1"
          fi
          timeout 600 qemu-system-aarch64 -M virt -cpu max -m 2048 -smp 2 \
            -nographic -no-reboot -kernel oracle/Image \
            -initrd oracle-initramfs.cpio.gz \
            -append "$COMMON selinux=0 dnsk_lkm=1 $NET_FLAG" 2>&1 | tee oracle.log
          ORC=${PIPESTATUS[0]}
          timeout 600 qemu-system-aarch64 -M virt -cpu max -m 2048 -smp 2 \
            -nographic -no-reboot -kernel device/Image \
            -initrd lkm-initramfs.cpio.gz \
            -append "$COMMON enforcing=0 dnsk_lkm=1 $NET_FLAG" 2>&1 | tee lkm.log
          LRC=${PIPESTATUS[0]}
          set -e
          echo "qemu_oracle_rc=$ORC qemu_lkm_rc=$LRC"
          [ "$ORC" -eq 0 ] || exit 1
          [ "$LRC" -eq 0 ] || exit 1
      - name: Compare probe output
        run: |
          set +e
          sh tests/qemu/diff_semantics.sh oracle.log lkm.log | tee diff.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "diff_rc=$rc"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-diff-log-${{ inputs.include_net }}
          path: |
            oracle.log
            lkm.log
            diff.log
          if-no-files-found: warn
