<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Droid LKM Suite</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
	<h1 data-i18n="title">Droid LKM Suite</h1>
	<div class="row" role="group" aria-label="Language / 语言">
		<button type="button" class="lang" id="lang-zh" data-lang="zh" aria-pressed="true">中文</button>
		<button type="button" class="lang" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
	</div>
</header>

<p class="sub" data-i18n="subtitle">android16-6.12 dev build. Every result below comes from dnskctl.</p>

<div id="bridge" class="banner warn" role="status" data-i18n="bridgeChecking">Checking the KSU WebUI bridge…</div>

<section class="card">
	<h2 data-i18n="cmdTitle">Commands</h2>
	<div class="row">
		<button type="button" data-cmd="status" data-i18n="btnStatus">Status</button>
		<button type="button" data-cmd="cap" data-i18n="btnCap">Capabilities</button>
		<button type="button" data-cmd="probe" data-i18n="btnProbe">Probe</button>
	</div>
	<div class="row">
		<button type="button" data-cmd="doctor --last-panic" data-i18n="btnDoctor">Doctor / last panic</button>
		<button type="button" data-cmd="logs 100" data-i18n="btnLogs">Logs (100)</button>
		<button type="button" data-cmd="boot-check" data-i18n="btnBoot">Boot check</button>
	</div>
	<div class="row">
		<select id="feature" aria-label="feature module" data-i18n-label="featureLabel">
			<option value="core">core</option>
			<option value="ns">ns</option>
			<option value="devtmpfs">devtmpfs</option>
			<option value="netfilter">netfilter</option>
			<option value="ipset">ipset</option>
			<option value="cgpids">cgpids</option>
			<option value="tmpfsx">tmpfsx</option>
			<option value="userns">userns</option>
		</select>
		<button type="button" data-cmd="load" class="primary" data-i18n="btnLoad">Load</button>
		<button type="button" data-cmd="unload" data-i18n="btnUnload">Unload</button>
	</div>
	<div class="row">
		<select id="profile" aria-label="profile" data-i18n-label="profileLabel">
			<option value="docker-v2">docker-v2</option>
			<option value="userns-full">userns-full</option>
			<option value="ufw-fail2ban">ufw-fail2ban</option>
			<option value="tmpfs-native">tmpfs-native</option>
		</select>
		<button type="button" data-cmd="profile" class="primary" data-i18n="btnProfile">Run profile</button>
	</div>
</section>

<section class="card">
	<h2 data-i18n="capTitle">Declared capability levels</h2>
	<div class="table-wrap">
		<table>
			<thead>
				<tr>
					<th data-i18n="thFeature">Feature</th>
					<th data-i18n="thLevel">Declared level</th>
					<th data-i18n="thNotes">Notes</th>
				</tr>
			</thead>
			<tbody id="cap-body"></tbody>
		</table>
	</div>
	<p class="note" data-i18n="capNote">Declared levels only.</p>
</section>

<section class="card">
	<div class="row between">
		<h2 data-i18n="outTitle">Output</h2>
		<button type="button" id="clear" data-i18n="clear">Clear</button>
	</div>
	<pre id="out" tabindex="0" aria-live="polite">Pick a command above.</pre>
</section>

<script src="app.js"></script>
</body>
</html>
