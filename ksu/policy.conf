# SPDX-License-Identifier: GPL-3.0-or-later
# M0 policy: only core is auto-loaded.  Every feature is loaded on demand by
# dnskctl/WebUI after its preflight passes.
auto=core
profiles=docker-v1,docker-v2,droidspaces,nixos,ufw-fail2ban,userns-full,tmpfs-native
# ABI profile this package was built for; dnskctl requires the module stamp to
# match before loading xt-based modules.
abi_profile=android16-6.12-xt104
# xt_match/xt_target size on the android16-6.12 MTK target (XTABLES_COMPAT=n).
# Other KMI/device profiles must override this before loading xt-based modules.
xt_layout=104
# Macro-able ABI knobs; the packaged modules must carry the same stamps.
page_size=4096
max_skb_frags=17
cgroup_subsys_count=8
